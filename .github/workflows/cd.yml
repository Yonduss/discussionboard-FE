name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/yonduss/discussionboard-fe
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish frontend image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./react-FE
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy frontend to EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/discussionboard
          chmod 600 ~/.ssh/discussionboard
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull frontend image and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/discussionboard \
            ubuntu@"$EC2_HOST" \
            "FRONTEND_IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
            set -eu
            cd /opt/discussionboard

            test -f docker-compose.prod.yml
            test -f .env

            if grep -q '^FRONTEND_IMAGE_TAG=' .env; then
              sed -i \
                "s/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=$FRONTEND_IMAGE_TAG/" \
                .env
            else
              printf 'FRONTEND_IMAGE_TAG=%s\n' "$FRONTEND_IMAGE_TAG" >> .env
            fi

            chmod 600 .env
            docker compose --env-file .env -f docker-compose.prod.yml pull frontend
            docker compose --env-file .env -f docker-compose.prod.yml \
              up -d --no-deps --wait frontend
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 http://127.0.0.1/
          REMOTE

      - name: Show deployment status on failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/discussionboard ubuntu@"$EC2_HOST" '
            if [ -d /opt/discussionboard ]; then
              cd /opt/discussionboard
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml \
                logs --no-color --tail=100 frontend
            fi
          ' || true
