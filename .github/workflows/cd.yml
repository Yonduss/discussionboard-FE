name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA that already passed CI on main
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/yonduss/discussionboard-fe
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish frontend image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}
          fetch-depth: 0

      - name: Verify manual commit belongs to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${#IMAGE_TAG}" -eq 40
          case "$IMAGE_TAG" in
            *[!0-9a-f]*)
              echo "commit_sha must be a lowercase 40-character SHA." >&2
              exit 1
              ;;
          esac
          git fetch origin main
          git merge-base --is-ancestor "$IMAGE_TAG" origin/main

      - name: Verify manual commit passed CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_run_id="$(gh run list \
            --workflow ci.yml \
            --commit "$IMAGE_TAG" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          test -n "$successful_run_id"

  publish:
    name: Publish frontend image
    needs: verify-source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./react-FE
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy frontend to EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy frontend through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          script_url="${{ github.server_url }}/${{ github.repository }}/raw/$IMAGE_TAG/scripts/deploy-frontend.sh"
          deploy_command="sh /tmp/deploy-frontend.sh '$IMAGE_TAG'"

          jq -n \
            --arg script_url "$script_url" \
            --arg deploy_command "$deploy_command" \
            '{commands: [
              "set -eu",
              ("curl --fail --silent --show-error --location --proto =https --tlsv1.2 " + $script_url + " --output /tmp/deploy-frontend.sh"),
              $deploy_command
            ]}' > "$RUNNER_TEMP/ssm-parameters.json"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy frontend $IMAGE_TAG" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' \
            --output text)"

          status=Pending
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text >&2
          test "$status" = "Success"
