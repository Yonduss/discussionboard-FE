<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 FIFA WC Board</title>
    <link rel="stylesheet" href="./css/post.css">
    <link rel="stylesheet" href="./css/user-edit.css">
    <link rel="stylesheet" href="./css/common.css">
</head>

<body>
    <div class="top-banner">
        <a class="logo-img" href="posts.html">
            <img src="/frontend/images/WC26_logo.svg" alt="logo" class="logo-img">
        </a>

        <h2>2026 FIFA WORLD CUP™</h2>

        <div class="profile-container">
            <div class="profile-circle" id="profileCircle">👤</div>
            <div class="profile-dropdown" id="profileDropdown">
                <a href="user-edit.html">Edit Profile</a>
                <a href="password-edit.html">Change Password</a>
                <a href="login.html" id="logoutButton">Logout</a>
            </div>
        </div>
    </div>


    <div class="signup-container">
        <h1>Edit Password</h1>

        <form id="passwordEditForm">
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password" required>
                <div class="error-message" id="currentPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                <div class="error-message" id="newPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                <div class="password-match-indicator" id="passwordMatch"></div>
            </div>

            <div class="button-group">
                <button type="submit" class="save-changes-btn" id="changePasswordBtn">Change Password</button>
            </div>
        </form>
    </div>

    <script type="module" src="./js/password-edit.js"></script>
</body>

</html>
