<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 FIFA WC Board</title>
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/common.css">
</head>

<body>
    <div class="top-banner">
        <a class="logo-img">
            <img src="/frontend/images/WC26_logo.svg" alt="logo" class="logo-img">
        </a>

        <h2>2026 FIFA WORLD CUP™</h2>
    </div>
    
    <div class="login-container">
        <h1>Login</h1>
        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button id="login-button" type="submit">Login</button>
            <button id="signup-button" type="button" class="signup-button">Sign Up</button>
        </form>
    </div>
    <script type="module" src="./js/auth-login.js"></script>
</body>

</html>
